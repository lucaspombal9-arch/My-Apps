<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LP PERFORMANCE — Alimentação</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap');
  :root { --bg: #080808; --text: #e8e8e8; --accent: #f59e0b; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; }
  .capa { width: 100%; height: 250px; position: relative; border-bottom: 3px solid var(--accent); }
  .capa img { width: 100%; height: 100%; object-fit: cover; }
  .capa-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 1.8rem; text-transform: uppercase; }
  .content { padding: 20px; }
</style>
</head>
<body>
<div class="capa">
  <img src="../1000043074.jpg" alt="Capa Atleta">
  <div class="capa-overlay"><h1>Plano de Alimentação</h1></div>
</div>
<div class="content">
  <p style="color: var(--accent); margin-bottom: 10px;">🍽️ PERFORMANCE E RECUPERAÇÃO</p>
  <p>Ficheiro pronto para o teu conteúdo.</p>
</div>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
